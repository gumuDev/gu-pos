spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_saas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:disabled}
  admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID:0}

storage:
  url: ${STORAGE_URL:http://localhost:9000}
  public-url: ${STORAGE_PUBLIC_URL:http://192.168.100.71:9000}
  bucket: ${STORAGE_BUCKET:receipts}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  provider: minio
